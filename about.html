<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About — Harshita Bhargava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;0,400;0,600;1,300&family=Rubik:wght@300&display=swap" rel="stylesheet">
<style>
  :root{
    --blue: #72cbff;
    --purple: #4e3ed8;
    --ink: #1f1e1e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    color:#1a1a1a;
    background:#fff;
  }
  a{ color:inherit; }

  .top-nav{
    max-width:760px;
    margin:0 auto;
    padding:32px 24px 0 24px;
  }
  .top-nav a{
    font-family:'Rubik', sans-serif;
    font-weight:300;
    font-size:14px;
    text-decoration:none;
    color:var(--ink);
    letter-spacing:0.5px;
  }
  .top-nav a:hover{ color:var(--purple); }

  header.page-head{
    max-width:760px;
    margin:0 auto;
    padding:64px 24px 0 24px;
  }
  h1{
    font-family:'Rubik', sans-serif;
    font-weight:300;
    font-size:48px;
    line-height:1.25;
    color:#000;
    margin:0 0 32px 0;
  }

  article{
    max-width:760px;
    margin:0 auto;
    padding:0 24px 64px 24px;
  }
  p{
    font-weight:300;
    font-size:18px;
    line-height:1.75;
    margin:0 0 22px 0;
    color:#2a2a2a;
  }
  em{ font-style:italic; }

  .contact{
    max-width:760px;
    margin:0 auto;
    padding:0 24px 96px 24px;
  }
  .contact h2{
    font-family:'Rubik', sans-serif;
    font-weight:300;
    font-size:22px;
    color:#000;
    margin:0 0 16px 0;
  }
  .contact-links{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .contact-links a{
    font-weight:300;
    font-size:18px;
    color:#2f6fed;
    text-decoration:none;
    width:fit-content;
  }
  .contact-links a:hover{ text-decoration:underline; }

  footer{
    max-width:760px;
    margin:0 auto;
    padding:0 24px 64px 24px;
  }
  footer a{
    font-family:'Rubik', sans-serif;
    font-weight:300;
    font-size:14px;
    text-decoration:none;
    color:var(--purple);
  }

  @media (max-width:640px){
    h1{ font-size:32px; }
  }
</style>
</head>
<body>

  <div class="top-nav"><a href="index.html">← Harshita Bhargava</a></div>

  <header class="page-head">
    <h1>About</h1>
  </header>

  <article>
    <p>[Add your bio here — who you are, what kind of design work you focus on, and the perspective you bring to it.]</p>
    <p>[A second paragraph, e.g. background, experience, or what you're currently working on.]</p>
  </article>

  <div class="contact">
    <h2>Get in touch</h2>
    <div class="contact-links">
      <a href="mailto:you@example.com">you@example.com</a>
      <a href="#">LinkedIn</a>
    </div>
  </div>

  <footer><a href="index.html">← Back to home</a></footer>

</body>
</html>
